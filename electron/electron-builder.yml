appId: com.pixivviewer.app
productName: PixivViewer
directories:
  output: release
files:
  - dist/**
  - electron/**
  - scripts/**
  - package.json
  - "!**/*.map"
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 桌面壳内嵌 Pixiv 代理：关闭自动更新检查（个人工具，避免打包后启动弹更新提示）
  runAfterFinish: true
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
